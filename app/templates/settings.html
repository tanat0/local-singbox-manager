{% extends "base.html" %}
{% block title %}Settings — Sing-Box Manager{% endblock %}
{% block content %}

<h1>Settings</h1>

{% if msg %}
<div class="alert alert-{{ msg_type }}">{{ msg }}</div>
{% endif %}

<div class="card">
  <form method="post" action="/settings">

    <div class="form-group">
      <label>DNS Preset</label>
      <select name="dns_preset">
        {% for key, preset in dns_presets.items() %}
        <option value="{{ key }}" {% if key == dns_preset %}selected{% endif %}>
          {{ preset.label }} — {{ preset.description }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Route Preset</label>
      <select name="route_preset">
        {% for key, preset in route_presets.items() %}
        <option value="{{ key }}" {% if key == route_preset %}selected{% endif %}>
          {{ preset.label }} — {{ preset.description }}
        </option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
  <p class="text-dim" style="margin-top:14px">
    Settings apply on next node activation. Currently active node is not redeployed automatically.
  </p>
</div>

{% endblock %}
