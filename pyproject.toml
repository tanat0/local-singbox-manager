[project]
name = "local-singbox-manager"
version = "1.3.0"
description = "Local web UI for managing a personal sing-box client on Linux."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "markupsafe>=2.1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = [
    # FastAPI uses Depends/Form/etc. calls in defaults as its dependency syntax.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]
"migrations/versions/*.py" = ["E501"]
"scripts/check-ops.py" = ["E402"]
"scripts/check-telegram.py" = ["E402"]
"tests/test_metrics.py" = ["E402"]
"tests/test_profiles.py" = ["E402"]
